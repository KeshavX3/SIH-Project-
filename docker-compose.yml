version: "3.9"

services:
  # ─── PostgreSQL + PostGIS ─────────────────────────────────────────────────
  db:
    image: postgis/postgis:15-3.4
    container_name: heatguard_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heatguard}
      POSTGRES_USER: ${POSTGRES_USER:-heatguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heatguard_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-heatguard} -d ${POSTGRES_DB:-heatguard}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── FastAPI Backend ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: heatguard_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-heatguard}:${POSTGRES_PASSWORD:-heatguard_secret_2024}@db:5432/${POSTGRES_DB:-heatguard}
      JWT_SECRET: ${JWT_SECRET:-heatguard-jwt-secret-change-in-production-min32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      DEMO_MODE: ${DEMO_MODE:-true}
      APP_ENV: ${APP_ENV:-development}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-app/ml/models/risk_model.pkl}
      RANDOM_SEED: ${RANDOM_SEED:-42}
      NOTIFICATION_MODE: ${NOTIFICATION_MODE:-mock}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ml_models:/app/app/ml/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ─── React Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: heatguard_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  ml_models:
    driver: local
